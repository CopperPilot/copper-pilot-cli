name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests examples
      - run: python -m ruff check src tests examples
      - run: python -m ty check src/copper_pilot_cli
      - run: python -m pytest -m "not live"
      - run: python -m pip_audit . --skip-editable
      # agent-client-protocol ships an Apache-2.0 LICENSE file but declares no
      # license in its wheel metadata, so pip-licenses reports it as UNKNOWN.
      - run: >-
          python -m piplicenses
          --format=plain-vertical
          --partial-match
          --ignore-packages agent-client-protocol
          --fail-on="GNU General Public License;GNU Affero General Public License;GPL;AGPL;UNKNOWN"
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
        if: runner.os != 'Windows'
      - run: python -m pip install --force-reinstall --no-deps (Get-ChildItem dist/*.whl)
        if: runner.os == 'Windows'
      - run: copper-pilot --version
      - run: copper-pilot-cli --version
