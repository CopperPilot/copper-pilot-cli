name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make lint
      - run: make test
      - run: python -m pip_audit . --skip-editable
      - run: >-
          python -m piplicenses
          --format=plain-vertical
          --partial-match
          --fail-on="GNU General Public License;GNU Affero General Public License;GPL;AGPL;UNKNOWN"
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
        if: runner.os != 'Windows'
      - run: python -m pip install --force-reinstall --no-deps (Get-ChildItem dist/*.whl)
        if: runner.os == 'Windows'
      - run: copper-pilot --version
      - run: copper-pilot-cli --version
