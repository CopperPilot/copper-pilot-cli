[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "copper-pilot-cli"
dynamic = ["version"]
description = "CopperPilot hosted agent for the terminal and LangChain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<4"
authors = [{ name = "CopperPilot" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiosqlite>=0.22,<1",
  "certifi>=2024.8.30",
  "deepagents==0.7.14",
  "httpx>=0.28,<1",
  "langchain-core>=1.6,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "markdownify>=1.2,<2",
  "mcp>=1.21,<2",
  "packaging>=25,<27",
  "pillow>=12,<13",
  "pydantic>=2.12,<3",
  "pyperclip>=1.11,<2",
  "pyyaml>=6,<7",
  "rich>=15,<16",
  "textual>=8.2.8,<9",
  "uuid-utils>=0.12,<2",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "build>=1.4,<2",
  "gitchangelog==3.0.4",
  "pip-audit>=2.10,<3",
  "pip-licenses>=5,<6",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "ty>=0.0.1",
]

[project.scripts]
copper-pilot = "copper_pilot_cli:cli_main"
copper-pilot-cli = "copper_pilot_cli:cli_main"

[project.urls]
Homepage = "https://copperpilot.ai"
Repository = "https://github.com/CopperPilot/copper-pilot-cli"
Issues = "https://github.com/CopperPilot/copper-pilot-cli/issues"
Documentation = "https://github.com/CopperPilot/copper-pilot-cli#readme"
Changelog = "https://github.com/CopperPilot/copper-pilot-cli/releases"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "\\A(?P<version>[^\\s]+)\\s*\\Z"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/VERSION",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/HISTORY.md",
  "/UPSTREAM.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/pyproject.toml",
  "/examples",
  "/skills",
  "/plugins",
  "/.claude-plugin",
]
exclude = [
  "/examples/**/.copperpilot/tmp",
  "/examples/**/.copperpilot/references",
  "/examples/**/.copperpilot/oracle",
]

[tool.hatch.build.targets.wheel]
packages = ["src/copper_pilot_cli"]

[tool.hatch.build.targets.wheel.shared-data]
"NOTICE" = "share/doc/copper-pilot-cli/NOTICE"
"UPSTREAM.md" = "share/doc/copper-pilot-cli/UPSTREAM.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-config --strict-markers"
markers = [
  "live: credential-aware end-to-end tests against the hosted CopperPilot service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-local-folder = ["helper"]

[tool.coverage.run]
source = ["copper_pilot_cli"]
omit = ["src/copper_pilot_cli/_upstream/*"]
